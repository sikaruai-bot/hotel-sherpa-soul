<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(10, 10)">
    <!-- Circular Frame -->
    <circle cx="40" cy="40" r="38" fill="url(#mountainGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#D4AF37" stroke-dasharray="2,3" stroke-width="1"/>

    <!-- Mountain Peaks -->
    <!-- Background Mountain -->
    <polygon points="40,16 64,54 16,54" fill="#334155" opacity="0.7"/>
    <!-- Snow Cap Back -->
    <polygon points="40,16 48,29 43,26 40,29 37,26 32,29" fill="#F8FAFC"/>

    <!-- Left Peak -->
    <polygon points="26,27 46,58 6,58" fill="#1E293B"/>
    <polygon points="26,27 32,36 29,34 26,36 23,34 20,36" fill="#FFFFFF"/>

    <!-- Main Everest / Sherpa Peak -->
    <polygon points="46,20 68,58 24,58" fill="#0F172A"/>
    <polygon points="46,20 54,32 50,30 46,33 42,30 38,32" fill="#FFFFFF"/>

    <!-- Sun / Golden Soul Wheel behind peaks -->
    <circle cx="40" cy="22" r="5" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M40,13 L40,15 M40,29 L40,31 M31,22 L33,22 M47,22 L49,22" stroke="#F3E5AB" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Endless Knot Motif Base -->
    <path d="M25,64 Q40,58 55,64 Q40,70 25,64 Z" fill="url(#goldGrad)"/>
    <circle cx="40" cy="64" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Main Title -->
    <text x="0" y="28" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="24" font-weight="900" letter-spacing="3" fill="#0F172A">
      HOTEL SHERPA SOUL
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="46" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="4" fill="#B45309">
      AUTHENTIC HIMALAYAN HOSPITALITY
    </text>

    <!-- Location & Status Badge -->
    <text x="2" y="60" font-family="'Inter', 'Segoe UI', sans-serif" font-size="8.5" font-weight="500" letter-spacing="1.5" fill="#64748B">
      THAMEL, KATHMANDU, NEPAL • ESTD. 2024
    </text>

    <!-- Decorative divider line -->
    <line x1="2" y1="34" x2="280" y2="34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
